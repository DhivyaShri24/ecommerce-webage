<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Checkout — Snack Bite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

<header>
  <nav>
    <ul class="nav-list">
      <li><a href="index.html">HOME</a></li>
      <li><a href="index.html">SHOP</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <h1>Checkout</h1>
  <p>Review your order and enter your details below.</p>
</section>

<section class="products">
  <div class="checkout-wrap">

    <div class="summary-box">
      <h3>Order Summary</h3>
      <p>Items in cart: <span id="summary-count">0</span></p>
      <p>Total: <span id="summary-total">$0</span></p>
      <p class="empty-note" id="empty-note">Your cart is empty — go back and add a snack first.</p>
    </div>

    <div class="form-box">
      <form id="checkout-form">
        <h3>Shipping Details</h3>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname">

        <label for="address">Delivery Address</label>
        <input type="text" id="address">

        <label for="city">City</label>
        <input type="text" id="city">

        <h3>Payment Details</h3>
        <label for="cardname">Name on Card</label>
        <input type="text" id="cardname">

        <label for="cardnumber">Card Number</label>
        <input type="text" id="cardnumber">

        <label for="expiry">Expiry</label>
        <input type="text" id="expiry" required maxlength="5" placeholder="MM/YY">

        <label for="cvv">CVV</label>
        <input type="text" id="cvv" required maxlength="3" placeholder="123">

        <button type="submit" class="btn" id="place-order-btn">Place Order</button>
      </form>

      <div class="confirmation" id="confirmation">
        <h2>Thanks, order placed!</h2>
        <p id="confirm-detail">Your snacks are on the way.</p>
        <a href="index.html" class="btn">Back to Shop</a>
      </div>
    </div>

  </div>
</section>

<footer>
  <p>&copy;2026 SNACK BITE</p>
</footer>

<script src="checkout.js"></script>
</body>
</html>
